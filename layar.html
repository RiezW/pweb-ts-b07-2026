<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Layar Antrean | Antrian Rumah Sakit</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/queue.css">
  <script type="module" src="dist/queue-display.js" defer></script>
</head>

<body class="queue-page">
  <header class="navbar">
    <div>
      <strong>Nomor sedang dipanggil</strong>
      <span id="queue-updated" role="status">Memuat antrean...</span>
    </div>

    <nav class="queue-nav" aria-label="Navigasi halaman">
      <a href="ambil-antrian.html">Ambil Nomor</a>
      <button id="fullscreen-button" type="button">Layar Penuh</button>
      <span id="current-user"></span>
      <button id="logout-button" type="button">Keluar</button>
    </nav>
  </header>

  <main class="dashboard">
    <section class="queue-board" aria-labelledby="queue-title">
      <div class="queue-board-heading">
        <div>
          <h1 id="queue-title">Layar Antrean</h1>
          <p>Informasi nomor antrean yang sedang dipanggil.</p>
          <p>Login wajib. Halaman dapat digunakan oleh admin, moderator, dan user.</p>
        </div>
      </div>

      <div id="queue-display-grid" class="queue-display-grid">
        <p class="queue-empty">Memuat jenis antrean...</p>
      </div>
    </section>
  </main>
</body>
</html>
